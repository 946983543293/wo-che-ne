// 【本仓库 vendoring 现代化改造】原版（2022）使用已移除的 jcenter()、插件内自带 AGP 3.5.1 buildscript、
// 以及 AGP 9 已删除的遗留 DSL（compileSdkVersion/minSdkVersion/lintOptions）。
// 改造点：
//   1. 删除 buildscript 块（Android 插件由宿主工程统一提供：AGP 9.1.0）
//   2. 删除 rootProject.allprojects 仓库块（仓库统一由宿主 android/build.gradle.kts 声明）
//   3. 补 namespace（AGP 8+ 必需，同时移除 AndroidManifest 的 package 属性）
//   4. 遗留 DSL → 现代 DSL；minSdk 21（高德 SDK 要求）
//   5. 原版把 dependencies 错误地嵌在 android{} 内，此处移到顶层（Gradle 9 严格校验）
//   6. compileOnly 保持不变：真正的 SDK 由宿主 app 以 implementation 引入
group 'com.amap.flutter.amap_flutter_location'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.amap.flutter.amap_flutter_location'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'com.amap.api:location:5.6.0'
}
