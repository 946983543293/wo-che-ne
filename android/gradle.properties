# 强制 Gradle JVM 以 UTF-8 解码文件：工程路径含中文时，AGP 解析 CMake/JSON 产物
# 若用平台默认字符集(GBK)会因多字节边界错位产生孤立反斜杠，触发 gson "Invalid escape sequence"
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
# 禁用 Gradle 常驻守护进程：避免守护进程跨构建持有 transforms 锁文件导致 FileNotFoundException
org.gradle.daemon=false
# Kotlin 编译走进程内：避免守护进程持有锁文件（受限环境下更稳）
kotlin.compiler.execution.strategy=in-process
# 关闭 Kotlin 增量编译缓存：避免受限环境/杀软导致的 incremental cache 关闭失败
kotlin.incremental=false
# 关闭构建缓存与文件系统监听：减少构建期磁盘写入与文件句柄抖动（受限环境更稳）
org.gradle.caching=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# 工程路径含中文（F:\WorkBuddy_data\我车呢\）：AGP 默认拒绝非 ASCII 路径，显式覆盖
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
